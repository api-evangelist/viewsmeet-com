    paths, an Agent Skills discovery index (v0.2.0 schema with a SHA-256 digest), an ARD/AIR ai-catalog.json
    (application/ai-catalog+json) named by robots.txt as the Agentmap, and an MCP server card. There is no
    separate MCP host: the MCP endpoint is https://viewsmeet.com/mcp on the apex, so the apex probe IS the
    MCP-host probe. www.viewsmeet.com 308-redirects every path to the apex.
