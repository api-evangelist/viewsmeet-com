  shape: '{ "error": { "code": "NOT_FOUND", "message": string } }'
  observed: 'GET /api/v1/nonexistent-probe -> 404 {"error":{"code":"NOT_FOUND","message":"That API or discovery route does not exist."}}'
  note: Nested shape used by the router for unknown API/discovery routes; differs from ProtocolError.
- name: JSON-RPC error
  media_type: application/json (MCP) / application/a2a+json (A2A)
  shape: '{ "jsonrpc": "2.0", "id": ..., "error": { "code": int, "message": string } }'
