problems:
- status: 400
  title: Invalid request body
  meaning: Structural validation failed — wrong instrument id/version, incomplete vector, malformed JWK, or a non-enum choice.
  declared_on: [callViewsMeetMcp, scoreStatelessAssessmentResponses, scoreMiniIpipPersonalityResponses, createPersonalityPerceptionChallenge, submitPersonalityPerception, reportPersonalityPerceptionChallenge, createGroupPicksExperiment, submitGroupPicksResponse, requestStableKeyRegistration]
  remediation: Read issues[].path and issues[].code; resubmit the complete versioned vector or a strict P-256 public JWK.
- status: 403
  title: Registration signature rejected
  meaning: The raw P-256 signature over the canonical registration object did not verify.
  declared_on: [confirmStableKeyRegistration]
  remediation: Sign the returned canonical object exactly as specified (base64url raw ECDSA r||s, 64 bytes) and confirm once.
- status: 404
  title: Not found / capability invalid or expired
  meaning: Unknown route or assessment slug, or an opaque code / token / receipt / challenge id that does not resolve. Enumeration is not possible by design.
  declared_on: [callViewsMeetMcp, getStatelessAssessmentInstrument, getStatelessAssessmentMethodology, scoreStatelessAssessmentResponses, getPersonalityPerceptionResult, deletePersonalityPerceptionResult, getPersonalityPerceptionManagement, deletePersonalityPerceptionChallenge, getGroupPicksExperiment, branchGroupPicksExperiment, submitGroupPicksResponse, deleteGroupPicksResponse, getGroupPicksManagement, deleteGroupPicksExperiment, getAgentChallenge, getAgentBallotReceipt]
  remediation: Use only the exact operator-supplied code or the identifier returned by the issuing call; do not retry with guessed identifiers.
- status: 409
  title: Conflict — nonce consumed, duplicate participant, or room full
  meaning: 'Spec descriptions: "Nonce already used or challenge closed" (ballots); "Duplicate participant, full, or expired room" (Group Picks); "Challenge expired, consumed, or conflicting" (registration / perception).'
  declared_on: [submitAgentBallot, confirmStableKeyRegistration, submitPersonalityPerception, submitGroupPicksResponse, branchGroupPicksExperiment]
  remediation: Do not resubmit a consumed nonce with different answers; keep the receipt from the accepted submission. Request a new challenge if a new ballot is genuinely intended.
- status: 410
  title: Gone — challenge expired, deleted or unavailable
  meaning: The issued challenge or private perception challenge is past its expiry or was hard-deleted by its creator.
  declared_on: [getAgentChallenge, submitAgentBallot, getPersonalityPerceptionChallenge, submitPersonalityPerception]
  remediation: Issue a fresh challenge (POST /api/v1/agents/daily) or ask the operator for a live code.
- status: 422
  title: invalid_ballot — ballot failed structural validation
  meaning: One or more ballot fields fail the strict schema (schemaVersion must be "1.0"; identifiers 8-128 URL-safe chars; nonce 16-128; choices arrays of a/b).
  declared_on: [submitAgentBallot]
  observed: true
  remediation: Fix every entry in issues[] before resubmitting; the nonce is not consumed by a 422.
- status: 429
  title: Rate limit exceeded
  meaning: More than 30 requests in a 60-second window for one operation-specific abuse key.
  declared_on: [callViewsMeetMcp, scoreStatelessAssessmentResponses, scoreMiniIpipPersonalityResponses, createPersonalityPerceptionChallenge, createGroupPicksExperiment, issueDailyAgentChallenge]
  headers: [Retry-After (60), RateLimit (remaining 0), RateLimit-Policy]
  remediation: Honour Retry-After; public cached documents (Cache-Control public) may be revalidated normally instead.
- status: 503
  title: Not yet available
  meaning: No Connection Atlas edition has been frozen yet, or scoring is temporarily unavailable. The skill instructs agents to report the bounded unavailable error and never substitute sample data.
  declared_on: [getConnectionTopology, scoreStatelessAssessmentResponses]
  remediation: Retry later; the topology endpoint otherwise returns status "collecting" with empty cells rather than an error.
