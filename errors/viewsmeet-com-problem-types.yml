source: >-
  Derived from the 4xx/5xx responses declared across openapi/viewsmeet-com-openapi.yml (every error response references
  components.schemas.ProtocolError) and confirmed against two live unauthenticated responses on 2026-09-19: a 422 from
  POST /api/agent/ballots with an empty body, and a 404 from an unknown /api/v1/ route. ViewsMeet does not use RFC 9457.
envelopes:
- name: ProtocolError
  media_type: application/json
  shape: '{ "error": string (machine code), "message": string, "issues"?: [ { "path": string, "code": string, "message": string } ] }'
  declared_by: components.schemas.ProtocolError (additionalProperties false; error + message required)
  observed: >-
    422 {"error":"invalid_ballot","message":"Ballot failed structural validation.","issues":[{"path":"schemaVersion",
    "code":"unsupported_version","message":"Expected '1.0'."}, ...]}
- name: RouterNotFound
