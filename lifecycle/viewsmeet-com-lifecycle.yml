    ledger checkpoints, topology editions) carry their own schemaVersion. MCP negotiates its revision natively
    (2025-06-18 today); A2A declares protocolVersion 1.0 in the agent card. The OpenAPI, agent card, server card,
    ai-catalog and MCP registry entry all share artifact version 0.5.0.
  docs: https://viewsmeet.com/developers#versioning
  statement: >-
    "Stable REST operations use the /api/v1/ prefix. Schemas carry their own version where a stored document must
    remain interpretable. Breaking API changes will use a new path version; before removing a published version,
    ViewsMeet will document the replacement and advertise deprecation and sunset timing in response headers. MCP and
    A2A versions are negotiated or declared by their native protocols."
