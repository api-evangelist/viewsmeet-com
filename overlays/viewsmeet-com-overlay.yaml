    tags:
    - Personality Perception
- target: $.paths['/api/v1/experiments/questions'].get
  update:
    tags:
    - Group Picks
- target: $.paths['/api/v1/experiments'].post
  update:
    tags:
    - Group Picks
- target: $.paths['/api/v1/experiments/{code}'].get
  update:
    tags:
    - Group Picks
