- target: $.paths['/mcp'].post.responses['429']
  update:
    headers:
      Retry-After:
        description: 'Seconds to wait; the developer guide states 429 responses carry Retry-After: 60.'
        schema:
          type: integer
      RateLimit-Policy:
        description: IETF draft RateLimit-Policy field; observed live as "minute";q=30;w=60.
        schema:
          type: string
      RateLimit:
        description: IETF draft RateLimit field with zero remaining on exhaustion.
        schema:
          type: string
