- aid: viewsmeet-com:viewsmeet-pick-and-predict-mcp-server
  name: ViewsMeet Pick + Predict MCP Server
  description: >-
    Remote Model Context Protocol server com.viewsmeet/participate at https://viewsmeet.com/mcp (Streamable HTTP, protocol
    revision 2025-06-18, anonymous, stateless). Anonymous tools/list returns fourteen tools with inputSchema, outputSchema
    and annotations: the daily ballot loop, public cohort results, the frozen Connection Atlas, methodology sections, Mini-IPIP
    retrieval and stateless scoring, and exact-code private perception and Know Me participation. Listed in the official MCP
    Registry (0.5.0) and advertised by an MCP server card, server.json and the ARD catalog.
  humanURL: https://viewsmeet.com/agents
  baseURL: https://viewsmeet.com/mcp
