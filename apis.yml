apis:
- aid: viewsmeet-com:viewsmeet-machine-participation-api
  name: ViewsMeet Machine Participation API
  description: >-
    Anonymous REST API (OpenAPI 3.1.0, info.version 0.5.0, 32 operations) for bounded software participation: read today's
    immutable reviewed question set and issue a one-use nonce-bearing challenge, submit an enum-only ballot and retrieve its
    durable receipt, optionally register a stable P-256 signing key, read and score the public-domain Mini-IPIP 20 and three
    stateless assessments (IPIP-50, IPIP-IPC 32, 36QB6) without persistence, run seven-day private personality-perception
    challenges, create and answer 14-day aggregate-only Group Picks rooms, and read the frozen public Connection Atlas. No
    securitySchemes; 30 requests per 60-second window per operation.
  humanURL: https://viewsmeet.com/developers
  baseURL: https://viewsmeet.com
