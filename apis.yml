- aid: viewsmeet-com:viewsmeet-participation-a2a-agent
  name: ViewsMeet Participation A2A Agent
  description: >-
    A2A v1.0 agent (JSON-RPC binding at https://viewsmeet.com/api/agent/a2a) with one skill, curated-either-or-participation:
    a bounded capability handshake that issues today's one-use challenge; the completed task artifact returns the REST submitUrl
    and receiptTemplate, and ballot submission happens over REST. Anonymous (securitySchemes {}), no streaming or push notifications.
    The card is served at /.well-known/agent-card.json as application/a2a+json.
  humanURL: https://viewsmeet.com/developers#a2a
  baseURL: https://viewsmeet.com/api/agent/a2a
