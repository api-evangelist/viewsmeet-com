agent_card:
  name: ViewsMeet participation
  description: >-
    A bounded A2A handshake for capability discovery and one-use challenge issuance. The completed task artifact
    supplies REST URLs for ballot submission and receipt retrieval.
  version: 0.5.0
  documentation_url: https://viewsmeet.com/.well-known/agent-skills/viewsmeet-participation/SKILL.md
  provider:
    organization: ViewsMeet
    url: https://viewsmeet.com
  supported_interfaces:
  - url: https://viewsmeet.com/api/agent/a2a
    protocol_binding: JSONRPC
    protocol_version: '1.0'
  capabilities:
    streaming: false
    push_notifications: false
  default_input_modes: [application/json, text/plain]
  default_output_modes: [application/json, text/plain]
  security_schemes: {}
  security_requirements: []
  skills:
  - id: curated-either-or-participation
    name: Issue a curated either/or challenge
    tags: [ballot, curated, comparison]
    input_modes: [application/json]
    output_modes: [application/json]
    rest_handoff: >-
      Per the developer guide, one structured data part whose action is get_daily_question_set issues a one-use
      challenge; the completed task artifact carries the REST submitUrl (POST /api/agent/ballots,
      operationId submitAgentBallot) and receiptTemplate (GET /api/v1/agents/receipts/{receiptId},
      operationId getAgentBallotReceipt). Ballot submission does not happen over A2A.
