          type: object
          additionalProperties: false
          required:
          - instrument
          - scoringKey
          - scoringInstructions
          properties:
            instrument:
              type: string
              format: uri
            scoringKey:
              type: string
              format: uri
            scoringInstructions:
              type: string
              format: uri
        citation:
          type: string
          minLength: 1
        scoring:
          type: object
          additionalProperties: true
        sourceCoefficientAlpha:
          type: object
          additionalProperties:
            type: number
            minimum: 0
            maximum: 1
        limitations:
          type: array
          minItems: 1
          items:
            type: string
        excludedInterpretations:
          type: array
          minItems: 1
          items:
            type: string
    AssessmentMethodologyResponse:
      type: object
      additionalProperties: false
      required:
      - methodology
      properties:
        methodology:
          $ref: '#/components/schemas/AssessmentMethodology'
    ProtocolError:
