          - ipip-ipc-32-en-v1
          - qb6-big-six-36-en-v1
        version:
          type: integer
          const: 1
        title:
          type: string
          minLength: 1
        itemCount:
          type: integer
          enum:
          - 50
          - 32
          - 36
        estimatedMinutes:
          type: integer
          minimum: 1
          maximum: 15
        summary:
          type: string
          minLength: 1
    AssessmentCatalogResponse:
      type: object
      additionalProperties: false
      required:
      - assessments
