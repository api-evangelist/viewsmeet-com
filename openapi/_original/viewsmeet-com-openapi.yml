          type: integer
          minimum: 1
          maximum: 15
        itemCount:
          type: integer
          enum:
          - 50
          - 32
          - 36
        responseOptions:
          type: array
          minItems: 5
          maxItems: 6
          items:
            $ref: '#/components/schemas/AssessmentResponseOption'
        items:
          type: array
          minItems: 32
          maxItems: 50
          items:
            $ref: '#/components/schemas/AssessmentItem'
    AssessmentInstrumentResponse:
