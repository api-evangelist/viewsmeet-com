      additionalProperties: false
      required:
      - schemaVersion
      - instrument
      - publicDomain
      - sourceUrls
      - citation
      - scoring
      - limitations
      - excludedInterpretations
      properties:
        schemaVersion:
          type: integer
          const: 1
        instrument:
          type: object
          additionalProperties: false
          required:
          - id
          - slug
          - version
          - scoringVersion
          - locale
          - itemCount
          - scaleCount
          properties:
            id:
              type: string
              enum:
              - ipip-big-five-50-en-v1
              - ipip-ipc-32-en-v1
              - qb6-big-six-36-en-v1
            slug:
              $ref: '#/components/schemas/AssessmentSlug'
            version:
              type: integer
              const: 1
            scoringVersion:
              type: string
            locale:
              type: string
              const: en
            itemCount:
              type: integer
              enum:
              - 50
              - 32
              - 36
            scaleCount:
              type: integer
              minimum: 5
              maximum: 8
        publicDomain:
          type: object
          additionalProperties: false
          required:
          - status
