description: >-
  ViewsMeet is free with no paid tier. The machine-readable cost statement at /pricing.md (last updated 2026-08-24) says:
  "ViewsMeet is free to use. There is no checkout, paid tier, subscription, wallet address, payment token, or purchase
  API today. Current revenue is $0." The daily round, quizzes, profile, public data, Agent Skill, A2A interface, MCP
  server and participation API are all available without an account or payment, subject to published safety and rate
  limits. A proposed $5 USD one-time "founding support" option is an aggregate, non-binding interest signal only — it
  is not for sale, takes no payment and creates no entitlement (Terms). /pricing (HTML) is 404; pricing.md is the page.
