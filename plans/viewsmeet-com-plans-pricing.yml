plans:
- id: viewsmeet-free
  name: Free
  type: free
  price: 0
  currency: USD
  billing_period: none
  description: Every human and machine surface, no account, no API key, no checkout.
  included:
  - Daily pick-and-predict round, Quick 5 / Know Me 24 quizzes, 21-choice profile, private friend comparisons
  - Public methodology, thresholded country and Atlas data, ledger verification
  - OpenAPI 3.1 REST participation API, MCP server, A2A interface, Agent Skill, ARD catalog
  limits:
  - 30 requests per 60-second window per operation-specific abuse key (rate-limits/viewsmeet-com-rate-limits.yml)
  - Group Picks rooms 5-20 questions, 50 responses, 14 days; perception challenges 7 days
  overage: none — requests over the window return 429 with Retry-After 60
  entries:
